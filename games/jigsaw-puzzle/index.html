<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Title</title>
	<script src="src/jigsaw-puzzle.js" type="module"></script>
</head>
<body>
	<header>
		<section>
			<section id="stats">
				<div id="time">Time:<span>000:00:00</span></div>
				<div id="moves">Moves:<span>0</span></div>
			</section>
			<section id="actions">
				<button data-testid="button-new" class="small primary" id="button-new"><span>New</span></button>
				<button data-testid="button-start" class="small primary" id="button-start"><span>Start</span></button>
				<button data-testid="button-pause" class="small primary" id="button-pause"><span>Pause</span></button>
				<button data-testid="button-continue" class="small primary" id="button-continue"><span>Continue</span></button>
				<button data-testid="button-exit" class="small primary" id="button-exit"><span>Exit</span></button>
				<button data-testid="button-cancel" class="small primary" id="button-cancel"><span>Cancel</span></button>
			</section>
		</section>
		<section>
			<div data-testid="puzzle-information" id="puzzle-information" class="hidden">
				<div>Name: <span class="puzzle-name"></span></div>
				<div>Cut: <span class="puzzle-cut"></span></div>
				<div>Number of Pieces: <span class="puzzle-num-pieces"></span></div>
			</div>
		</section>
	</header>
	<main>
		<div data-testid="blank-screen" id="blank-screen">jigsaw-puzzle</div>
		<div data-testid="puzzle-wrapper" id="puzzle-wrapper" class="hidden">
			<div data-testid="puzzle" id="puzzle"></div>
		</div>
	</main>
	<footer>&copy; 2012-2025 m. parker smith a.k.a. TheVirtuoid</footer>

	<dialog data-testid="new-game-dialog" id="new-game-dialog">
		<section class="selections">
			<div data-testid="new-game-dialog-image-list" id="new-game-dialog-image-list">
				<h2>1. Select Image</h2>
			</div>
			<div data-testid="new-game-dialog-cut-list" id="new-game-dialog-cut-list">
				<h2>2. Select Cut</h2>
			</div>
			<div data-testid="new-game-dialog-numpiece-list" id="new-game-dialog-numpiece-list">
				<h2>3. Select Number of Pieces</h2>
			</div>
		</section>
		<section class="button-bar">
			<button data-testid="new-dialog-button-continue" class="small primary" id="new-dialog-button-continue" disabled><span>Continue</span></button>
			<button data-testid="new-dialog-button-cancel" class="small secondary" id="new-dialog-button-cancel"><span>Cancel</span></button>
		</section>
	</dialog>
</body>
</html>
