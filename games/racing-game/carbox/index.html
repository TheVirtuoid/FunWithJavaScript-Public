<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Racing Sandbox</title>
	<script src="carbox.js" type="module"></script>
</head>
<body style="background-color: #111111;">
<header></header>
<main>
	<h1>Welcome to the Carbox!</h1>
	<div class="sandbox">
		<section class="scene">
			<!-- <canvas id="world" width="1557" height="876"></canvas> -->
			<canvas id="world" width="800" height="600"></canvas>
		</section>
		<section class="controls" id="controls">
			<h2>Controls</h2>
			<div class="data">
				<h3>Car</h3>
				<label><span>Scale</span><input type="number" id="car-scale" value="" step=".05" min="0" max="2"/></label>
				<section>
					<h4>Chassis</h4>
					<label><span>Mass</span><input type="number" id="car-chassis-mass" value="" step="1" min="0"/></label>
					<label><span>Friction</span><input type="number" id="car-chassis-friction" value="" step=".1" min="0" max="1"/></label>
					<label><span>Restitution</span><input type="number" id="car-chassis-restitution" value="" step="1" min="0" max="1"/></label>
				</section>
				<section>
					<h4>Wheel</h4>
					<label><span>Mass</span><input type="number" id="car-wheel-mass" value="" step="1" min="0"/></label>
					<label><span>Friction</span><input type="number" id="car-wheel-friction" value="" step=".1" min="0" max="1"/></label>
					<label><span>Restitution</span><input type="number" id="car-wheel-restitution" value="" step="1" min="0" max="1"/></label>
				</section>
			</div>
			<div class="data">
				<h3>Ground</h3>
				<label><span>Friction</span><input type="number" id="ground-friction" value="" step=".1" min="0" max="1"/></label>
				<label><span>Restitution</span><input type="number" id="ground-restitution" value="" step="1" min="0" max="1"/></label>
				<section>
					<h4>Rotation</h4>
					<label><span for="ground-rotation-axis">Axis</span>
						<select id="ground-rotation-axis">
							<option value="x">x</option>
							<option value="y">y</option>
							<option value="z">z</option>
						</select>
					</label>
					<label><span>Amount</span><input type="number" id="ground-rotation-amount" value="" /></label>
				</section>
			</div>
			<div class="data">
				<label><span>Click to Reset</span><button id="reset">RESET</button></label>
			</div>
		</section>
	</div>
</main>
<footer>&copy; 2012-2025 m. parker smith a.k.a. TheVirtuoid</footer>
</body>
</html>
