<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Virtuoid: Snake on HTML</title>
</head>
<body>
<header></header>
<main>
	<section class="container">
		<h1 id="title"></h1>
		<div class="gameplay-container">
			<div class="control-panel">
				<div id="score">
					<h2></h2>
					<ul>
						<li><span></span><span data-score></span></li>
						<li><span></span><span data-length></span></li>
					</ul>
				</div>
				<div id="countdown"></div>
				<div id="messages">
				</div>
				<div id="action-buttons" class="button-group">
					<button id="try-again" class="medium primary">Try Again</button>
					<button id="go-back" class="medium secondary">Go Back</button>
				</div>
			</div>
			<div id="pitch">
			</div>
		</div>
	</section>
</main>
<footer>&copy; 2012-2025 m. parker smith a.k.a. TheVirtuoid</footer>
</body>
<script src="./js/snake-html.js" type="module"></script>
</html>
