<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Virtuoid: Snake</title>
</head>
<body>
	<header></header>
	<main>
		<section class="container">
			<h1>Snake</h1>
			<section class="selection-container">
				<div>
					<h3>Select your input</h3>
					<ul id="input-selection-group">
						<li><label><input type="radio" value="kb-wasd" name="input-selection" />Keyboard (WASD keys)</label></li>
						<li><label><input type="radio" value="kb-arrow" name="input-selection" />Keyboard (Arrow keys)</label></li>
						<li><label><input type="radio" value="game-controller" name="input-selection" />Game Controller</label></li>
						<li><label><input type="radio" value="vr-set" name="input-selection" disabled />VR Set</label></li>
					</ul>
				</div>
				<div>
					<h3>Select your UI</h3>
					<ul id="ui-selection-group">
						<li><label><input type="radio" value="ui-terminal" name="ui-selection" disabled />Terminal</label></li>
						<li><label><input type="radio" value="ui-html" name="ui-selection" />HTML</label></li>
						<li><label><input type="radio" value="ui-canvas" name="ui-selection" disabled />Canvas</label></li>
						<li><label><input type="radio" value="ui-2d" name="ui-selection" disabled />2D (using PhaserJS)</label></li>
						<li><label><input type="radio" value="ui-2d" name="ui-selection" disabled />3D (using BabylonJS)</label></li>
						<li><label><input type="radio" value="ui-4d" name="ui-selection" disabled />4D (mystery!)</label></li>
					</ul>
				</div>
			</section>
			<section class="button-group">
				<button class="primary small" id="go-button" disabled>Go!</button>
			</section>
		</section>
	</main>
	<footer>&copy; 2012-2025 m. parker smith a.k.a. TheVirtuoid</footer>
</body>
<script src="./js/snake.js" type="module"></script>
</html>
