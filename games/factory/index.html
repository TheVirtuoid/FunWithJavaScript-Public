<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Virtuoid: Factory</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet" />
	<script src="js/factory.js" type="module"></script>
</head>
<body>
	<h1>Virtuoid: Factory</h1>
	<div class="field">
		<section class="stats">
			<div class="stat information"></div>
			<div class="stat cursor-position">
				Cursor Position: <span id="cursor-position"></span>
			</div>
			<div class="stat cash">
				Cash: <span id="cash"></span>
			</div>
			<div class="stat inventory">
				<h4>Inventory</h4>
				<ul id="inventory" class="inventory-list"></ul>
			</div>
		</section>
		<section id="pitch"></section>
		<section class="store" id="store">
			<h3>Factory Store</h3>
			<div class="subsection conveyors">
				<h5>Conveyors</h5>
				<ul>
				</ul>
			</div>
			<div class="subsection extractors">
				<h5>Extractors</h5>
				<ul>
				</ul>
			</div>
			<div class="subsection purifiers">
				<h5>Purifiers</h5>
				<ul>
				</ul>
			</div>
			<div class="subsection combinators">
				<h5>Combinators</h5>
				<ul>
				</ul>
			</div>
		</section>
	</div>
</body>
</html>
