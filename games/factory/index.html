<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Virtuoid: Factory</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet" />
	<script src="js/factory.js" type="module"></script>
</head>
<body>
	<h1>Virtuoid: Factory</h1>
	<div class="field">
		<section class="stats">
			<div class="stat information">
				<h4>Information</h4>
				<p>Nothing to see here.</p>
			</div>
			<div class="stat cursor-position">
				Cursor Position: <span id="cursor-position"></span>
			</div>
			<div class="stat cash">
				Cash: <span id="cash"></span>
			</div>
			<div class="stat level">
				Level: <span id="level"></span>
			</div>
			<div class="stat inventory">
				<h4>Inventory</h4>
				<ul id="inventory" class="inventory-list"></ul>
			</div>
		</section>
		<section id="pitch"></section>
		<section class="store" id="store">
			<h3>Factory Store</h3>
			<div class="subsection levels">
				<span>Advance to Level <span id="next-level">2</span></span>
				<button class="primary small purchase" id="level-up">1000</button>
			</div>
			<div class="subsection conveyors">
				<h5>Conveyors</h5>
				<ul>
					<li>
						<img src="img/conveyor-straight.png" alt="Conveyor Straight"/>
						<button class="primary small purchase" data-id="conveyor-straight">100</button>
					</li>
					<li>
						<img src="img/conveyor-curve-left.png" alt="Conveyor Curve Left"/>
						<button class="primary small purchase" data-id="conveyor-curve-left">100</button>
					</li>
					<li>
						<img src="img/conveyor-curve-right.png" alt="Conveyor Curve Right"/>
						<button class="primary small purchase" data-id="conveyor-curve-right">100</button>
					</li>
					<li>
						<img src="img/conveyor-t-intersection-right.png" alt="Conveyor T Right"/>
						<button class="primary small purchase" data-id="conveyor-t-intersection-right">100</button>
					</li>
					<li>
						<img src="img/conveyor-t-intersection-left.png" alt="Conveyor T Left"/>
						<button class="primary small purchase" data-id="conveyor-t-intersection-left">100</button>
					</li>
					<li>
						<img src="img/conveyor-x-intersection.png" alt="Conveyor X"/>
						<button class="primary small purchase" data-id="conveyor-x-intersection">100</button>
					</li>
				</ul>
			</div>
			<div class="subsection extractors">
				<h5>Extractors</h5>
				<ul>
					<li>
						<img src="img/extractor-aetherite.png" alt="Extractor Aetherite"/>
						<button class="primary small purchase" data-id="extractor-aetherite">100</button>
					</li>
					<li>
						<img src="img/extractor-obsidianite.png" alt="Extractor Obsidianite"/>
						<button class="primary small purchase" data-id="extractor-obsidianite">100</button>
					</li>
					<li>
						<img src="img/extractor-pyrotite.png" alt="Exractor Pyrotite"/>
						<button class="primary small purchase" data-id="extractor-pyrotite">100</button>
					</li>
					<li>
						<img src="img/extractor-luminite.png" alt="Extractor Luminite"/>
						<button class="primary small purchase" data-id="extractor-luminite">100</button>
					</li>
					<li>
						<img src="img/extractor-zenithite.png" alt="Extractor Zenithite"/>
						<button class="primary small purchase" data-id="extractor-zenithite">100</button>
					</li>
				</ul>
			</div>
			<div class="subsection purifiers">
				<h5>Purifiers</h5>
				<ul>
					<li>
						<img src="img/purifier-aetherite.png" alt="Purifier Aetherite"/>
						<button class="primary small purchase" data-id="purifier-aetherite">100</button>
					</li>
					<li>
						<img src="img/purifier-obsidianite.png" alt="Purifier Obsidianite"/>
						<button class="primary small purchase" data-id="purifier-obsidianite">100</button>
					</li>
					<li>
						<img src="img/purifier-pyrotite.png" alt="Purifier Pyrotite"/>
						<button class="primary small purchase" data-id="purifier-pyrotite">100</button>
					</li>
					<li>
						<img src="img/purifier-luminite.png" alt="Purifier Luminite"/>
						<button class="primary small purchase" data-id="purifier-luminite">100</button>
					</li>
					<li>
						<img src="img/purifier-zenithite.png" alt="Purifier Zenithite"/>
						<button class="primary small purchase" data-id="purifier-zenithite">100</button>
					</li>
				</ul>
			</div>
			<div class="subsection combinators">
				<h5>Combinators</h5>
				<ul>
					<li>
						<img src="img/combinator-etherium.png" alt="Combinator Etherium"/>
						<button class="primary small purchase" data-id="combinator-etherium">100</button>
					</li>
					<li>
						<img src="img/combinator-ignisium.png" alt="Combinator Ignisium"/>
						<button class="primary small purchase" data-id="combinator-ignisium">100</button>
					</li>
					<li>
						<img src="img/combinator-magnanium.png" alt="Combinator Magnanium"/>
						<button class="primary small purchase" data-id="combinator-magnanium">100</button>
					</li>
					<li>
						<img src="img/combinator-photonium.png" alt="Combinator Photonium"/>
						<button class="primary small purchase" data-id="combinator-photonium">100</button>
					</li>
					<li>
						<img src="img/combinator-soltarium.png" alt="Combinator Soltarium"/>
						<button class="primary small purchase" data-id="combinator-soltarium">100</button>
					</li>
					<li>
						<img src="img/combinator-voidtissium.png" alt="Combinator Voidtissium"/>
						<button class="primary small purchase" data-id="combinator-voidtissium">100</button>
					</li>
					<li>
						<img src="img/combinator-starforge.png" alt="Combinator Starforge"/>
						<button class="primary small purchase" data-id="combinator-starforge">100</button>
					</li>
				</ul>
			</div>
		</section>
	</div>
</body>
</html>
