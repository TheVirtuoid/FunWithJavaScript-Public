<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet" />
	<title>Virtuoid: Weed Wacker</title>
</head>
<body>
	<main>
		<section id="panel">
			<h1>WEED WACKER</h1>
			<div class="stats">
				<p class="time"><span>Time:</span><span id="time">0</span></p>
				<p><span>Score:</span><span id="score">0</span></p>
				<p><span>Power:</span><span id="power">0</span></p>
				<p><span>Speed:</span><span id="speed">0</span></p>
				<p><span>Range:</span><span id="range">0</span></p>
				<p><span>Durability:</span><span id="durability">0</span></p>
				<p><span>Spawn Rate:</span><span id="spawn-rate">0</span></p>
			</div>
			<div class="action-buttons">
				<button id="level-up">Level Up</button>
				<button id="new-game">New Game</button>
			</div>
			<div class="weeds">
				<h3>Weeds</h3>
				<p><span>image</span><span>0</span></p>
				<p><span>image</span><span>0</span></p>
				<p><span>image</span><span>0</span></p>
				<p><span>image</span><span>0</span></p>
				<p><span>image</span><span>0</span></p>
			</div>
		</section>
		<section id="yard"></section>
	</main>
	<footer>
		copyright &copy; 2012-2026 m. parker smith a.k.a. TheVirtuoid
	</footer>
	<script type="module" src="./js/index.js"></script>
</body>
</html>
